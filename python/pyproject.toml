[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeops-agent-python"
version = "0.1.0"
description = "Python rewrite track for KnowledgeOps Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "greenlet>=3.1,<4",
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "aio-pika>=9.5,<10",
  "pypdf>=6.13.3,<7",
  "python-multipart>=0.0.20,<1",
  "redis>=5.0,<6",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "structlog>=24.4,<26",
  "langgraph>=1.0.10,<2",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.0,<7"
]
mysql = [
  "asyncmy>=0.2.11,<1"
]
quality = [
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.8,<3",
  "cyclonedx-bom>=6.0,<8"
]

[project.scripts]
knowledgeops-python-api = "knowledgeops_py.main:run"
knowledgeops-python-contract = "knowledgeops_py.scripts.contract_gate:main"
knowledgeops-python-e2e-smoke = "knowledgeops_py.scripts.e2e_smoke:main"
knowledgeops-python-maturity = "knowledgeops_py.scripts.maturity_gate:main"
knowledgeops-python-parity-report = "knowledgeops_py.scripts.parity_report:main"
knowledgeops-python-perf-smoke = "knowledgeops_py.scripts.perf_smoke:main"
knowledgeops-python-security-gate = "knowledgeops_py.scripts.security_gate:main"
knowledgeops-python-worker = "knowledgeops_py.workers.runner:main"
knowledgeops-python-baseline-manifest = "knowledgeops_py.scripts.java_baseline_manifest:main"
knowledgeops-python-manifest-gate = "knowledgeops_py.scripts.manifest_gate:main"
knowledgeops-python-cross-contract = "knowledgeops_py.scripts.cross_runtime_contract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=knowledgeops_py --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "src/knowledgeops_py/domain",
  "src/knowledgeops_py/infrastructure",
  "src/knowledgeops_py/observability",
]
exclude = ["alembic"]

[tool.coverage.run]
omit = [
  "src/knowledgeops_py/main.py",
  "src/knowledgeops_py/scripts/*",
  "src/knowledgeops_py/workers/*",
]
