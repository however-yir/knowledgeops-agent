apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "knowledgeops-python.fullname" . }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "knowledgeops-python.fullname" . }}, app.kubernetes.io/component: migrate}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec", "alembic upgrade head && APP_DATABASE_URL=$APP_PGVECTOR_URL alembic upgrade head"]
          envFrom:
            - configMapRef: {name: {{ include "knowledgeops-python.fullname" . }}}
            - secretRef: {name: {{ .Values.secretName }}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
