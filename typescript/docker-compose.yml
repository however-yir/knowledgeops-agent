services:
  knowledgeops-agent-ts:
    build:
      context: .
    container_name: knowledgeops-agent-ts
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_SECURITY_ENABLED: "true"
      APP_JWT_SECRET: replace_with_32_bytes_min_secret
      APP_DEMO_API_KEY: local-demo-api-key
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8088,http://localhost:5173
      APP_INGESTION_QUEUE_BACKEND: in-memory
      APP_INGESTION_WORKER_ENABLED: "true"
      APP_INGESTION_WORKER_CONCURRENCY: 2
      APP_PRISMA_ENABLED: "false"
      DATABASE_URL: mysql://root:root@mysql:3306/knowledgeops_agent
      APP_VECTOR_BACKEND: local
      APP_EMBEDDING_ENABLED: "false"
      APP_RATE_LIMIT_ENABLED: "true"
      APP_DISTRIBUTED_RATE_LIMIT_ENABLED: "false"
      APP_COST_ENABLED: "true"
      APP_WORKSPACE_ROOT: /workspace
      RAG_RETRIEVE_TOP_K: 8
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ..:/workspace:ro
      - ts-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  mysql:
    image: mysql:8.4
    container_name: knowledgeops-agent-ts-mysql
    environment:
      MYSQL_DATABASE: knowledgeops_agent
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  redis:
    image: redis:7-alpine
    container_name: knowledgeops-agent-ts-redis
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: knowledgeops-agent-ts-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"

volumes:
  ts-data:
