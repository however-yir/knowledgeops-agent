x-app-environment: &app-environment
  NODE_ENV: production
  APP_SECURITY_ENABLED: "true"
  APP_JWT_SECRET: 0123456789abcdef0123456789abcdef
  APP_DEMO_API_KEY: local-demo-api-key
  APP_CORS_ALLOWED_ORIGINS: http://localhost:8088,http://localhost:5173
  APP_PRISMA_ENABLED: "true"
  DATABASE_URL: mysql://root:root@mysql:3306/knowledgeops_agent
  APP_INGESTION_QUEUE_BACKEND: redis_stream
  APP_REDIS_URL: redis://redis:6379
  APP_REDIS_STREAM_KEY: knowledgeops:ingestion
  APP_REDIS_DLQ_STREAM_KEY: knowledgeops:ingestion:dlq
  APP_REDIS_CONSUMER_GROUP: knowledgeops-workers
  APP_REDIS_CONSUMER_NAME: worker-1
  APP_RABBITMQ_URL: amqp://knowledgeops:knowledgeops@rabbitmq:5672
  APP_RABBITMQ_EXCHANGE: ingestion.exchange
  APP_RABBITMQ_ROUTING_KEY: ingestion.jobs
  APP_RABBITMQ_QUEUE: ingestion.jobs.queue
  APP_RABBITMQ_DLQ_EXCHANGE: ingestion.dlx
  APP_RABBITMQ_DLQ_ROUTING_KEY: ingestion.jobs.dlq
  APP_RABBITMQ_DLQ_QUEUE: ingestion.jobs.dlq.queue
  APP_VECTOR_BACKEND: local
  APP_EMBEDDING_ENABLED: "false"
  APP_LLM_ENABLED: "false"
  APP_WEB_SEARCH_BACKEND: searxng
  APP_WEB_SEARCH_SEARXNG_URL: http://searxng:8080
  APP_RATE_LIMIT_ENABLED: "true"
  APP_DISTRIBUTED_RATE_LIMIT_ENABLED: "false"
  APP_COST_ENABLED: "true"
  APP_AGENT_HARNESS_TRUSTED_ENABLED: "false"
  APP_WORKSPACE_WRITE_ENABLED: "false"
  APP_WORKSPACE_SHELL_ENABLED: "false"
  APP_WORKSPACE_ROOT: /workspace
  RAG_RETRIEVE_TOP_K: 8

x-app-base: &app-base
  profiles: ["typescript", "enterprise"]
  build:
    context: .
  environment: *app-environment
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - ..:/workspace:ro
    - ts-data:/app/data
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  migrate:
    profiles: ["typescript", "enterprise"]
    build:
      context: .
    environment:
      <<: *app-environment
      APP_BOOTSTRAP_DEMO_KEY: "true"
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed-demo"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  knowledgeops-agent-ts:
    <<: *app-base
    container_name: knowledgeops-agent-ts
    environment:
      <<: *app-environment
      PORT: 3000
      APP_INGESTION_WORKER_ENABLED: "false"
      APP_WORKFLOW_ASYNC_ENABLED: "false"
      APP_AUDIT_RETENTION_WORKER_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  knowledgeops-worker-ts:
    <<: *app-base
    container_name: knowledgeops-worker-ts
    command: ["node", "apps/api/dist/worker.main.js"]
    environment:
      <<: *app-environment
      APP_REDIS_CONSUMER_NAME: worker-compose-1
      APP_INGESTION_WORKER_ENABLED: "true"
      APP_WORKFLOW_ASYNC_ENABLED: "true"
      APP_AUDIT_RETENTION_WORKER_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mysql:
    profiles: ["typescript", "enterprise"]
    image: mysql:8.4
    container_name: knowledgeops-agent-ts-mysql
    environment:
      MYSQL_DATABASE: knowledgeops_agent
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    profiles: ["typescript", "enterprise"]
    image: redis:7-alpine
    container_name: knowledgeops-agent-ts-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    profiles: ["typescript", "enterprise"]
    image: rabbitmq:3-management
    container_name: knowledgeops-agent-ts-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: knowledgeops
      RABBITMQ_DEFAULT_PASS: knowledgeops
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  ts-data:
  mysql-data:
  redis-data:
  rabbit-data:
