apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "knowledgeops-agent-ts.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "knowledgeops-agent-ts.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "knowledgeops-agent-ts.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "knowledgeops-agent-ts.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "scripts/prisma-migrate.mjs"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              value: {{ .Values.secretEnv.DATABASE_URL | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
