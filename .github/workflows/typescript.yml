name: TypeScript Rewrite CI

on:
  push:
    branches: [main, ts-rewrite]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: knowledgeops_agent
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: typescript
        run: pnpm typecheck

      - name: Test
        working-directory: typescript
        run: pnpm test

      - name: Java parity contract
        working-directory: typescript
        run: pnpm parity

      - name: Database schema parity
        working-directory: typescript
        run: pnpm db:validate

      - name: Java vs TS contract diff
        working-directory: typescript
        run: pnpm contract:diff

      - name: Frontend TS backend contract
        working-directory: typescript
        run: pnpm frontend:contract

      - name: Migration readiness
        working-directory: typescript
        run: pnpm migration:readiness

      - name: Build
        working-directory: typescript
        run: pnpm build

      - name: E2E smoke
        working-directory: typescript
        run: pnpm e2e:smoke

      - name: Performance smoke
        working-directory: typescript
        run: pnpm perf:smoke

      - name: Load gate
        working-directory: typescript
        run: LOAD_DURATION_SECONDS=10 LOAD_VUS=50 LOAD_P99_MS=30000 pnpm load:gate

      - name: SBOM
        working-directory: typescript
        run: pnpm sbom

      - name: Docker Compose config
        working-directory: typescript
        run: docker compose -f docker-compose.yml config

      - name: Docker build
        working-directory: typescript
        run: docker build -t knowledgeops-agent-ts:ci .
