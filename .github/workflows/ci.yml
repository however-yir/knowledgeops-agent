name: KnowledgeOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile and run enforced static analysis
        run: mvn -q validate compile

      - name: Run unit tests and coverage gate
        run: mvn -q verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Generate SBOM
        run: mvn -q cyclonedx:makeAggregateBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: target/bom.*

  evaluator-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify ragproof response contract
        run: python3 scripts/verify_ragproof_contract.py

      - name: Build evaluator contract fixture
        run: |
          python3 scripts/generate_eval_contract_fixture.py \
            --dataset evaluation/dataset.large.json \
            --output evaluation/predictions.contract.json

      - name: Validate evaluator contract thresholds
        run: |
          python3 scripts/run_regression.py \
            --dataset evaluation/dataset.large.json \
            --predictions evaluation/predictions.contract.json \
            --report-dir reports/evaluation-contract \
            --threshold 0.70 \
            --correctness-threshold 0.75 \
            --citation-hit-threshold 0.70 \
            --hallucination-max-rate 0.05 \
            --failure-max-rate 0.02 \
            --first-token-max-ms 1500

      - name: Upload evaluator contract reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluator-contract-report
          path: reports/evaluation-contract/latest.*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint, format, type-check, and build
        run: npm run ci && npm run build
