name: Python Rewrite CI

on:
  push:
    branches: [python-rewrite]
    paths:
      - "python/**"
      - "docker-compose.python.yml"
      - "docker-compose.contract.yml"
      - "python/helm/**"
      - "frontend/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,quality]"

      - name: Lint
        run: ruff check python/src python/tests

      - name: Type check
        working-directory: python
        run: mypy

      - name: Security static analysis
        run: bandit -q -r python/src/knowledgeops_py -x python/src/knowledgeops_py/scripts

      - name: Alembic migration gate
        working-directory: python
        run: APP_DATABASE_URL=sqlite+aiosqlite:////tmp/knowledgeops-ci.db alembic upgrade head

      - name: Fixed Java baseline manifest
        env:
          BASELINE_SHA: fea55aef923e2dda72dd3859aa6bd8f9a8cc9573
        run: |
          baseline_dir=$(mktemp -d)
          git worktree add --detach "$baseline_dir" "$BASELINE_SHA"
          trap 'git worktree remove --force "$baseline_dir"' EXIT
          knowledgeops-python-manifest-gate \
            --repository "$baseline_dir" \
            --manifest python/parity/java-baseline-manifest.json

      - name: Test
        working-directory: python
        run: pytest

      - name: Contract gate
        working-directory: python
        run: knowledgeops-python-contract

      - name: Security defaults
        working-directory: python
        run: knowledgeops-python-security-gate

      - name: Maturity gate
        working-directory: python
        run: knowledgeops-python-maturity

      - name: E2E smoke
        working-directory: python
        run: knowledgeops-python-e2e-smoke

      - name: Performance smoke
        working-directory: python
        run: ITERATIONS=40 P95_MS=1500 knowledgeops-python-perf-smoke

      - name: Dependency audit and SBOM
        working-directory: python
        run: |
          pip-audit --progress-spinner=off
          cyclonedx-py environment --output-file reports/python-sbom.json

      - name: Python parity report
        working-directory: python
        run: knowledgeops-python-parity-report

      - name: Upload Python evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-rewrite-evidence
          path: |
            python/reports/**

      - name: Docker build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t knowledgeops-agent-python:ci \
            python

      - name: Build frontend image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -f frontend/Dockerfile \
            -t knowledgeops-agent-web:ci \
            .

      - name: Helm render gate
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.16.3 lint python/helm/knowledgeops-python
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.16.3 template knowledgeops python/helm/knowledgeops-python > /tmp/knowledgeops-python-helm.yaml
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.16.3 template knowledgeops python/helm/knowledgeops-python --set platform.enabled=true --set java.enabled=true > /tmp/knowledgeops-python-platform-helm.yaml
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.16.3 template knowledgeops python/helm/knowledgeops-python --set persistence.enabled=false > /tmp/knowledgeops-python-ephemeral-helm.yaml
          grep -Fq 'component: rabbitmq' /tmp/knowledgeops-python-platform-helm.yaml
          grep -Fq 'component: frontend' /tmp/knowledgeops-python-platform-helm.yaml
          grep -Fq 'emptyDir: {}' /tmp/knowledgeops-python-ephemeral-helm.yaml

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: python/
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/python-rewrite'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deployment images
        if: github.ref == 'refs/heads/python-rewrite'
        env:
          PYTHON_IMAGE: ghcr.io/${{ github.repository }}-python
          WEB_IMAGE: ghcr.io/${{ github.repository }}-web
        run: |
          for image in "$PYTHON_IMAGE" "$WEB_IMAGE"; do
            if [ "$image" = "$PYTHON_IMAGE" ]; then
              local_image=knowledgeops-agent-python:ci
            else
              local_image=knowledgeops-agent-web:ci
            fi
            docker tag "$local_image" "$image:${GITHUB_SHA}"
            docker tag "$local_image" "$image:python-rewrite"
            docker push "$image:${GITHUB_SHA}"
            docker push "$image:python-rewrite"
          done

  frontend-e2e:
    name: Vue / Python canonical E2E
    needs: python
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: knowledgeops-frontend-${{ github.run_id }}
      FRONTEND_BASE_URL: http://localhost:8088
      E2E_API_KEY: local-demo-api-key
      E2E_TENANT_ID: public
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Start isolated Python platform and Vue frontend
        run: docker compose -f docker-compose.python.yml up --build -d --wait --wait-timeout 240 web

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Vue against the Python canonical upstream
        working-directory: frontend
        run: npm run test:e2e

      - name: Collect frontend E2E evidence
        if: always()
        run: |
          mkdir -p reports/frontend-e2e
          docker compose -f docker-compose.python.yml ps > reports/frontend-e2e/docker-ps.txt || true
          docker compose -f docker-compose.python.yml logs --no-color > reports/frontend-e2e/docker-logs.txt || true

      - name: Upload frontend E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-frontend-e2e-evidence
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
            reports/frontend-e2e/**

      - name: Shutdown isolated Python platform
        if: always()
        run: docker compose -f docker-compose.python.yml down -v --remove-orphans

  cross-runtime-contract:
    name: Java/Python cross-runtime contract
    needs: [python, frontend-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare fixed Java baseline
        env:
          BASELINE_SHA: fea55aef923e2dda72dd3859aa6bd8f9a8cc9573
        run: |
          baseline_dir="$RUNNER_TEMP/java-baseline"
          git worktree add --detach "$baseline_dir" "$BASELINE_SHA"
          echo "JAVA_CONTEXT=$baseline_dir" >> "$GITHUB_ENV"

      - name: Run isolated cross-runtime contract stack
        env:
          COMPOSE_PROJECT_NAME: knowledgeops-contract-${{ github.run_id }}
        run: |
          docker compose -f docker-compose.contract.yml up --build -d --wait --wait-timeout 180 java-api
          docker compose -f docker-compose.contract.yml up --build -d python-migrate
          docker compose -f docker-compose.contract.yml wait python-migrate
          docker compose -f docker-compose.contract.yml up -d --wait --wait-timeout 180 python-api
          docker compose -f docker-compose.contract.yml up --no-deps --abort-on-container-exit --exit-code-from contract contract

      - name: Collect cross-runtime logs
        if: always()
        env:
          COMPOSE_PROJECT_NAME: knowledgeops-contract-${{ github.run_id }}
        run: |
          mkdir -p reports/cross-runtime
          docker compose -f docker-compose.contract.yml ps > reports/cross-runtime/docker-ps.txt || true
          docker compose -f docker-compose.contract.yml logs --no-color > reports/cross-runtime/docker-logs.txt || true

      - name: Upload cross-runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-runtime-contract-evidence
          path: reports/cross-runtime/**

      - name: Shutdown cross-runtime stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: knowledgeops-contract-${{ github.run_id }}
        run: docker compose -f docker-compose.contract.yml down -v --remove-orphans

      - name: Remove fixed Java baseline worktree
        if: always()
        run: git worktree remove --force "$RUNNER_TEMP/java-baseline" || true
