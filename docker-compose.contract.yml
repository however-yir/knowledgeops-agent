services:
  contract-model:
    image: python:3.13-alpine
    command: ["python", "/app/openai_contract_stub.py"]
    volumes:
      - ./python/scripts/openai_contract_stub.py:/app/openai_contract_stub.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

  java-mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: contract-mysql-pass
      MYSQL_DATABASE: knowledgeops_java
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pcontract-mysql-pass"]
      interval: 3s
      timeout: 3s
      retries: 30

  python-mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: contract-mysql-pass
      MYSQL_DATABASE: knowledgeops_python
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pcontract-mysql-pass"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledgeops_python
      POSTGRES_PASSWORD: contract-postgres-pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledgeops_python"]
      interval: 3s
      timeout: 3s
      retries: 30

  java-api:
    build:
      context: ${JAVA_CONTEXT:-.}
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://java-mysql:3306/knowledgeops_java?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: contract-mysql-pass
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      OPENAI_BASE_URL: http://contract-model:8000
      OPENAI_API_KEY: contract-stub-key
      APP_JWT_SECRET: contract-ci-jwt-secret-must-not-be-default
      APP_SECURITY_ENABLED: "true"
      SPRING_SECURITY_FILTER_DISPATCHER_TYPES: request
      APP_VECTOR_STORE_BACKEND: simple
      APP_REQUIRE_PGVECTOR: "false"
      APP_INGESTION_WORKER_ENABLED: "false"
      APP_MODEL_ROUTER_AB_ENABLED: "false"
      APP_WEB_SEARCH_ENABLED: "false"
      APP_AGENT_HARNESS_TRUSTED_ENABLED: "false"
      APP_AGENT_HARNESS_WORKSPACE_WRITE_ENABLED: "false"
      APP_AGENT_HARNESS_WORKSPACE_SHELL_ENABLED: "false"
    depends_on:
      contract-model:
        condition: service_healthy
      java-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s

  python-migrate:
    build: &python-build
      context: ./python
    image: knowledgeops-contract-python:local
    command:
      [
        "sh",
        "-ec",
        "for attempt in $$(seq 1 30); do if alembic upgrade head && APP_DATABASE_URL=$${APP_PGVECTOR_URL} alembic upgrade head; then exit 0; fi; sleep 2; done; exit 1"
      ]
    environment: &python-environment
      APP_ENV: production
      APP_DATABASE_URL: mysql+aiomysql://root:contract-mysql-pass@python-mysql:3306/knowledgeops_python
      APP_PGVECTOR_URL: postgresql+asyncpg://postgres:contract-postgres-pass@pgvector:5432/knowledgeops_python
      APP_REDIS_URL: redis://redis:6379/0
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      APP_INGESTION_QUEUE_BACKEND: memory
      APP_VECTOR_BACKEND: pgvector
      APP_DEMO_API_KEY: dev-admin-key-2026
      APP_DEMO_TENANT_ID: public
      APP_JWT_SECRET: contract-ci-jwt-secret-must-not-be-default
      APP_MODEL_BACKEND: openai_compatible
      APP_MODEL_BASE_URL: http://contract-model:8000/v1
      APP_MODEL_API_KEY: contract-stub-key
      APP_MODEL_NAME: contract-model
      APP_RERANKER_BACKEND: remote
      APP_RERANKER_URL: http://contract-model:8000/rerank
      APP_TRUSTED_RUNTIME_ENABLED: "false"
      APP_WORKSPACE_WRITE_ENABLED: "false"
      APP_WORKSPACE_SHELL_ENABLED: "false"
    depends_on:
      python-mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy

  python-api:
    image: knowledgeops-contract-python:local
    command: ["knowledgeops-python-api"]
    environment:
      <<: *python-environment
      HOST: 0.0.0.0
      PORT: 3001
    depends_on:
      contract-model:
        condition: service_healthy
      python-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/actuator/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  contract:
    image: knowledgeops-contract-python:local
    command:
      [
        "sh",
        "-ec",
        "knowledgeops-python-cross-contract --java-base-url http://java-api:8080 --python-base-url http://python-api:3001 --api-key dev-admin-key-2026 --tenant-id public --cases /contracts/cross-runtime-ci-cases.json"
      ]
    volumes:
      - ./python/parity:/contracts:ro
    depends_on:
      java-api:
        condition: service_healthy
      python-api:
        condition: service_healthy
